name: Customer Retention MLOps

on:
  push:
    branches: [main, production-mlops]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-api.txt
            requirements-train.txt

      - name: Install API and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-api.txt -r requirements-train.txt pytest ruff

      - name: Lint
        run: python -m ruff check src training api tests

      - name: Compile Python sources
        run: python -m compileall -q src training api

      - name: Unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q
