name: Customer Retention MLOps

on:
  push:
    branches: [main, production-mlops]
  pull_request:
    branches: [main]

jobs:
  test-lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt -r requirements-train.txt pytest ruff
      - name: Lint
        run: ruff check src training api tests
      - name: Compile
        run: python -m compileall -q src training api
      - name: Unit tests
        run: pytest -q
