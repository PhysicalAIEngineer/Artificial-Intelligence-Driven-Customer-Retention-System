services:
  api:
    build: .
    ports: ["8000:8000"]
    volumes: ["./artifacts:/app/artifacts:ro"]
    environment:
      MODEL_VERSION: churn-v1
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow/mlflow.db --default-artifact-root /mlflow/artifacts
    volumes: ["mlflow_data:/mlflow"]
    ports: ["5000:5000"]
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
volumes:
  mlflow_data:
